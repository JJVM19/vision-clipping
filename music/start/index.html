<script>
/* Same as /explainer/: keep a tracked click id, then clean the address bar before paint. */
(function(){try{
  var s=window.location.search;
  if(!/[?&](vx_cid=|utm_)/.test(s))return;
  var v=new URLSearchParams(s).get("vx_cid");
  if(v&&/^c_[0-9a-f]{8,32}$/i.test(v)){localStorage.setItem("vx_cid",v);localStorage.setItem("vx_cid_at",String(Date.now()));}
  var keep=new URLSearchParams();var q=new URLSearchParams(s);
  ["v"].forEach(function(k){if(q.get(k)!==null)keep.set(k,q.get(k));});
  var qs=keep.toString();
  if(window.history&&history.replaceState){history.replaceState(null,"",window.location.pathname+(qs?"?"+qs:"")+window.location.hash);}
}catch(e){}})();
</script>

<script>
(function () {
  var FORM = "https://forms.visionclipping.com/music";
  function clickId() {
    try {
      var at = Number(localStorage.getItem("vx_cid_at") || 0);
      var cid = localStorage.getItem("vx_cid");
      if (cid && at && Date.now() - at < 30 * 24 * 3600 * 1000) return cid;
    } catch (e) {}
    return null;
  }
  var f = document.getElementById("vc-form-music");
  var cid = clickId();
  f.src = FORM + "?src=music" + (cid ? "&vx_cid=" + encodeURIComponent(cid) : "");
  window.addEventListener("message", function (e) {
    if (!e.data || e.origin !== "https://forms.visionclipping.com") return;
    if (e.data.type === "vision-form-height" && typeof e.data.height === "number") {
      f.style.height = Math.max(400, e.data.height) + "px";
    }
  });
})();
</script>
<script>
/* A page can be served from a browser cache minutes after a deploy, pointing at files that deploy
   removed. Ask the server which build is current and reload once if this copy is behind. */
(function(){
  var m=document.querySelector('meta[name="vc-build"]');
  if(!m||!window.fetch)return;
  var mine=(m.getAttribute('content')||'').trim();
  function check(){
    fetch('/build.txt?cb='+Date.now(),{cache:'no-store'})
      .then(function(r){return r.ok?r.text():'';})
      .then(function(t){
        var live=(t||'').trim();
        if(!live||!mine||live===mine)return;
        try{if(sessionStorage.getItem('vc-build-reload')===live)return;sessionStorage.setItem('vc-build-reload',live);}catch(e){}
        location.reload();
      })
      .catch(function(){});
  }
  check();
  document.addEventListener('visibilitychange',function(){if(!document.hidden)check();});
})();
</script>
